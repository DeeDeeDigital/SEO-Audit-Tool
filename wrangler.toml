name = "seo-audit-tool"
main = "./worker.js"
compatibility_date = "2024-01-01"

# Static assets — served by worker.js via env.ASSETS.fetch()
# binding = "ASSETS" makes them accessible inside the Worker
[assets]
directory = "./dist"
binding = "ASSETS"

# Environment variables for local dev
# Copy .env.example to .env and fill in values — Wrangler reads .env automatically
# For production, set in Cloudflare dashboard > Workers > seo-audit-tool > Settings > Variables

[vars]
# PAGESPEED_API_KEY = ""  # Set in CF dashboard, not here
